<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>True Seal — El Mührü Hafıza Oyunu</title>
<meta name="description" content="On iki el mührünü ezberle ve aynı sırayla ör. Dizi uzar, gösterim hızlanır, süre daralır. Kombo bozulmadan ne kadar ileri gidebilirsin?">
<meta name="theme-color" content="#08070a">
<meta property="og:title" content="True Seal">
<meta property="og:description" content="Diziyi ezberle, mühürleri sırayla ör. Tek bir mühür şaşarsa jutsu bozulur.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://true-seal.vercel.app/">
<meta property="og:image" content="https://true-seal.vercel.app/assets/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/lang.css">
<link rel="stylesheet" href="css/title.css">
<link rel="stylesheet" href="css/landing.css">
<link rel="stylesheet" href="css/scroll.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/overlays.css">
</head>
<body>

<div class="track" id="track">

  <section class="panel panel--hero" id="hero-panel" data-i18n-aria="hero.aria">
    <div class="hero__scene" id="hero-scene" aria-hidden="true">
      <div class="hero__art" id="hero-art"></div>
      <canvas class="hero__embers" id="ember-canvas"></canvas>
      <div class="hero__haze" id="hero-haze"></div>
      <div class="hero__torch" id="hero-torch"></div>
    </div>

    <div class="lang lang--hero" role="group" data-i18n-aria="lang.aria">
      <button class="lang__opt" type="button" data-lang="tr" aria-pressed="true">TR</button>
      <button class="lang__opt" type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>

    <div class="hero__content" id="hero-content">
      <h1 class="hero__title" id="hero-title" data-text="TRUE SEAL">
        <span class="sr-only">True Seal</span>
      </h1>

      <div class="hero__rule" aria-hidden="true"></div>

      <p class="hero__desc" data-i18n="hero.desc">On iki el mührü. Diziyi ezberle, aynı sırayla ör.</p>

      <button class="start-btn" id="start-btn" type="button" disabled>
        <span class="start-btn__ring" aria-hidden="true"></span>
        <span class="start-btn__wave" aria-hidden="true"></span>
        <span class="start-btn__plate" aria-hidden="true"></span>
        <span class="start-btn__label" data-i18n="hero.start">OYUNA BAŞLA</span>
      </button>

      <div class="hero__status" id="hero-status">
        <div class="loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria="hero.loadingAria">
          <div class="loading-bar__fill" id="loading-fill"></div>
        </div>
        <p class="loading-text" id="loading-text"></p>
      </div>
    </div>
  </section>

  <section class="panel panel--game" id="game-panel" data-i18n-aria="game.aria">
    <div class="game__art" id="game-art" aria-hidden="true"></div>
    <div class="game__stress" aria-hidden="true"></div>

    <header class="hud">
      <button class="hud__btn" id="back-btn" type="button" data-i18n-aria="game.back">
        <span aria-hidden="true">←</span>
        <span class="hud__btn-text" data-i18n="game.back">Ana Menü</span>
      </button>

      <div class="hud__stats">
        <p class="stat"><span class="stat__key" data-i18n="game.level">Seviye</span><span class="stat__val" id="stat-level">1</span></p>
        <p class="stat"><span class="stat__key" data-i18n="game.seals">Mühür</span><span class="stat__val" id="stat-length">3</span></p>
        <p class="stat stat--score"><span class="stat__key" data-i18n="game.score">Puan</span><span class="stat__val" id="stat-score">0</span></p>
        <p class="combo-chip" id="combo-chip" hidden>
          <span class="combo-chip__key" data-i18n="game.combo">KOMBO</span>
          <span class="combo-chip__val" id="combo-value">0</span>
        </p>
      </div>

      <div class="hud__right">
        <div class="lang lang--hud" role="group" data-i18n-aria="lang.aria">
          <button class="lang__opt" type="button" data-lang="tr" aria-pressed="true">TR</button>
          <button class="lang__opt" type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button class="hud__btn hud__btn--icon" id="mute-btn" type="button" aria-pressed="false">
          <span class="hud__icon" id="mute-icon" aria-hidden="true">◉</span>
          <span class="sr-only"></span>
        </button>
      </div>
    </header>

    <div class="stage">
      <div class="scroll scroll--screen">
        <span class="scroll__rod scroll__rod--left" aria-hidden="true"></span>
        <span class="scroll__rod scroll__rod--right" aria-hidden="true"></span>
        <div class="scroll__paper">
          <div class="seal-screen" id="seal-screen">
            <img class="seal-screen__img" id="seal-screen-img" alt="" hidden>
          </div>
        </div>
      </div>

      <div class="stage__meta">
        <div class="stage__bar">
          <div class="progress-dots" id="progress-dots" aria-hidden="true"></div>
          <div class="timer" id="timer" hidden aria-hidden="true">
            <div class="timer__fill" id="timer-fill"></div>
          </div>
        </div>
        <div class="stage__row">
          <p class="stage__hint" id="stage-hint" role="status"></p>
          <button class="replay-btn" id="replay-btn" type="button" disabled>
            <span data-i18n="game.replay">Tekrar Göster</span>
            <span class="replay-btn__count" id="replay-count">3</span>
          </button>
        </div>
      </div>
    </div>

    <div class="scroll scroll--grid">
      <span class="scroll__rod scroll__rod--left" aria-hidden="true"></span>
      <span class="scroll__rod scroll__rod--right" aria-hidden="true"></span>
      <div class="scroll__paper">
        <div class="seal-grid" id="seal-grid" role="group" data-i18n-aria="game.gridAria"></div>
      </div>
    </div>

    <div class="game__overlay" id="game-overlay" aria-hidden="true" hidden>
      <p class="game__overlay-text" id="overlay-text"></p>
    </div>

    <div class="seal-flash" id="seal-flash" aria-hidden="true">
      <div class="seal-flash__inner">
        <img class="seal-flash__img" id="seal-flash-img" alt="">
        <p class="seal-flash__name">
          <span class="seal-flash__kana" id="flash-kana"></span>
          <span class="seal-flash__romaji" id="flash-romaji"></span>
        </p>
      </div>
    </div>

    <p class="score-pop" id="score-pop" aria-hidden="true"></p>

    <div class="combo-burst" id="combo-burst" aria-hidden="true" data-heat="2">
      <span class="combo-burst__ring"></span>
      <span class="combo-burst__ring combo-burst__ring--late"></span>
      <p class="combo-burst__text" id="combo-text"></p>
    </div>

    <div class="gameover" id="gameover" hidden>
      <div class="gameover__card" role="dialog" aria-modal="true" aria-labelledby="gameover-title">
        <p class="gameover__kanji" aria-hidden="true">解</p>
        <h2 class="gameover__title" id="gameover-title" data-i18n="over.title">MÜHÜR BOZULDU</h2>
        <p class="gameover__body" id="gameover-body"></p>

        <p class="gameover__score">
          <span class="gameover__score-key" data-i18n="over.score">Puan</span>
          <strong class="gameover__score-val" id="gameover-score">0</strong>
        </p>

        <dl class="gameover__stats">
          <div><dt data-i18n="over.level">Seviye</dt><dd id="gameover-level">1</dd></div>
          <div><dt data-i18n="over.combo">En uzun kombo</dt><dd id="gameover-combo">0</dd></div>
          <div><dt data-i18n="over.best">Rekor</dt><dd id="gameover-best">0</dd></div>
        </dl>

        <p class="gameover__record" id="gameover-record" data-i18n="over.record" hidden>Yeni rekor!</p>

        <div class="gameover__actions">
          <button class="btn btn--primary" id="retry-btn" type="button" data-i18n="over.retry">Tekrar Dene</button>
          <button class="btn btn--ghost" id="menu-btn" type="button" data-i18n="over.menu">Ana Menü</button>
        </div>
      </div>
    </div>
  </section>

</div>

<script src="js/i18n.js"></script>
<script src="js/seals.js"></script>
<script src="js/rules.js"></script>
<script src="js/audio.js"></script>
<script src="js/assets.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
